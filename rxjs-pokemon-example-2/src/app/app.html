<h1>Pokemon Demo</h1>

    @if (isLoading()) {
      <p>Loading...</p>
    } @else if (error()) {
      <p class="error">{{ error() }}</p>
    } @else {
      <div class="pokemon-grid">
        @for (data of pokemonData(); track data.pokemon.id) {
          <div class="pokemon-card">
            <h2>{{ data.pokemon.name | titlecase }}</h2>
            <p><strong>ID:</strong> {{ data.pokemon.id }}</p>
            <p><strong>Types:</strong> {{ data.pokemon.types.join(', ') }}</p>
            <img [src]="data.pokemon.sprite" [alt]="data.pokemon.name" width="120" height="120" />
            <p class="flavor-text">{{ data.species.flavorText }}</p>
          </div>
        }
      </div>
    }
